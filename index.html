<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site no GitHub</title>
    <style>
        /* --- SEU CÓDIGO CSS COMEÇA AQUI --- */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 2.5rem;
        }

        p {
            color: #7f8c8d;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .botao {
            display: inline-block;
            background-color: #3498db;
            color: #ffffff;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .botao:hover {
            background-color: #2980b9;
        }

        /* --- SEU CÓDIGO CSS TERMINA AQUI --- */
    </style>
</head>
<body>

    <div class="container">
        <h1>Olá, Mundo! 👋</h1>
        <p>Este é o meu primeiro site criado com HTML e CSS, hospedado gratuitamente através do GitHub Pages.</p>
        <a href="#" class="botao">Clique Aqui</a>
    </div>

</body>
</html>
